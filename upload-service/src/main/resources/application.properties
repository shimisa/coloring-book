spring.application.name=upload-service

# Active Profile (dev = local storage, prod = S3 storage)
spring.profiles.active=dev

# Server configuration
server.port=8083
server.servlet.context-path=/api/upload-service

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_UPLOAD_SERVICE}?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# AWS S3
aws.s3.bucket=my-coloring-app-pictures

# OpenAI
openai.api.key=YOUR_OPENAI_KEY

spring.ai.openai.api-key=${OPEN_AI_KEY}


# ============================================
# Kafka Configuration
# ============================================
# All Kafka settings are configured here. Spring Boot auto-configures KafkaTemplate.

# Bootstrap servers
spring.kafka.bootstrap-servers=localhost:9092

# Producer serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=com.example.upload_service.config.EventJsonSerializer

# Producer reliability settings
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Producer performance settings
spring.kafka.producer.properties.batch.size=16384
spring.kafka.producer.properties.linger.ms=1
spring.kafka.producer.properties.buffer.memory=33554432

# Timeout configurations (fail faster when Kafka is unavailable)
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.reconnect.backoff.ms=500
spring.kafka.producer.properties.reconnect.backoff.max.ms=5000

# JSON serialization settings
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Application URL
app.base-url=http://localhost:8083/api/upload-service

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=200MB
app.max-file-size-bytes=10485760

