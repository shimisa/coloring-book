server:
  port: 8080 # Gateway runs on port 8080

spring:
  application:
    name: api-gateway-pp
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - Access-Control-Allow-Origin
              - Access-Control-Allow-Credentials
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: user-auth
          uri: ${app.user-auth-service.url}
          predicates:
            - Path=/api/user-auth/**
        - id: photo-painter
          uri: ${app.photo-painter-service.url}
          predicates:
            - Path=/api/photo-painter/**
        - id: upload-service
          uri: ${app.upload-service.url}
          predicates:
            - Path=/api/upload-service/**
        # Add other service routes here

app:
  user-auth-service:
    url: http://localhost:8081
  photo-painter-service:
    url: http://localhost:8082
  upload-service:
    url: http://localhost:8083

# JWT configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 1 hour in milliseconds

logging:
  level:
    com.example.api_gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
