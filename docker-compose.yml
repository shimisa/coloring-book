version: '3.8'

services:
  # Kafka broker (KRaft mode - no Zookeeper needed)
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Cluster ID for KRaft
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Topic settings
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - photo-painter-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Single MySQL database server for all services
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - photo-painter-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # User Authentication Service
  user-auth-service:
    build:
      context: ./user-auth-pp
      dockerfile: Dockerfile
    container_name: user-auth-service
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/user_auth_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - mysql-db
    networks:
      - photo-painter-network
    restart: unless-stopped

  # Photo Painter Service
  photo-painter-service:
    build:
      context: ./photo-painter
      dockerfile: Dockerfile
    container_name: photo-painter-service
    environment:
      MYSQL_DATABASE_SERVER: ${MYSQL_DATABASE_SERVER}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      OPEN_AI_KEY: ${OPEN_AI_KEY}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/photo_painter_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      - mysql-db
    networks:
      - photo-painter-network
    volumes:
      - photo_uploads:/app/uploads
    restart: unless-stopped

  # Upload Service
  upload-service:
    build:
      context: ./upload-service
      dockerfile: Dockerfile
    container_name: upload-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/upload_service_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      - mysql-db
      - kafka
    networks:
      - photo-painter-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway-pp
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      APP_USER_AUTH_SERVICE_URL: http://user-auth-service:8081
      APP_PHOTO_PAINTER_SERVICE_URL: http://photo-painter-service:8082
    ports:
      - "8080:8080"
    depends_on:
      - user-auth-service
      - photo-painter-service
    networks:
      - photo-painter-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./UI
      dockerfile: Dockerfile
    container_name: photo-painter-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - photo-painter-network
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:8080

volumes:
  kafka_data:
    driver: local
  mysql_data:
    driver: local
  photo_uploads:
    driver: local

networks:
  photo-painter-network:
    driver: bridge
