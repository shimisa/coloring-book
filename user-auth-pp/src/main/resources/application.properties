spring.application.name=user-auth

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Email configuration
email.username=${EMAIL_USERNAME}
email.password=${EMAIL_PASSWORD}
email.port=587
email.host=smtp.gmail.com
email.protocol=smtp
email.from=paint@gmail.com
email.subject=Photo-Painter - Email Confirmation


# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000 # 1 hour in milliseconds

# Logging configuration
logging.level.root=INFO
#logging.level.org.springframework.web=DEBUG

# Server configuration
server.port=8081
server.servlet.context-path=/api/user-auth


# CORS configuration
spring.webmvc.cors.allowed-origins=http://localhost:3000
spring.webmvc.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.webmvc.cors.allowed-headers=Authorization,Content-Type,Accept,Origin
spring.webmvc.cors.allow-credentials=true
spring.webmvc.cors.max-age=3600


